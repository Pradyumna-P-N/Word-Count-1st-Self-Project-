<body>
    <header>
        <h1 class="heading">Word Count Device</h1>
        <h2 class="text1">Want to know the amount of words in your block of text?</h2>
    </header>
    <main>
        <label for="words">Enter your text here :</label>
        <textarea id="words"></textarea>
        <div>
            <button class="colour" id="Enter">Enter</button>
            <button class="colour" id="Back">Back</button>
        </div>
        <p id="display1"></p>
        <p id="display2"></p>
        <p id="display3"></p>
        <p id="display4"></p>
    </main>
